<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light"><meta name="robots" content="noindex">
<title>Solicita</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📑</text></svg>">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;--bg:#F6F8FB;--ink:#17222E;--muted:#5A6876;--line:#E0E6EC;--blue:#2457C5;--ok:#1D7A46;--no:#B0352D}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:1.5rem 1.25rem 4rem}
.logo{font-weight:800;font-size:1.3rem;margin-bottom:1.5rem;display:block;color:var(--ink);text-decoration:none}.logo span{color:var(--blue)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:1.4rem}
h1{font-size:1.5rem;line-height:1.2;margin:0 0 .6rem}
p{margin:0 0 1rem}.muted{color:var(--muted)}
label{display:block;font-weight:700;margin:1rem 0 .3rem}
input{font:inherit;padding:.6rem .75rem;border:1px solid #C9D3DC;border-radius:8px;width:100%;max-width:320px}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button{font:inherit;font-weight:700;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:.8rem 1.3rem;cursor:pointer;margin-top:1rem}
button:disabled{opacity:.5;cursor:not-allowed}
.ok{color:var(--ok);font-weight:700}.err{color:var(--no)}
a{color:var(--blue)}
</style></head>
<body><div class="wrap"><a class="logo" href="/">Solicita<span>.</span></a><div class="card" id="box" aria-live="polite"><p class="muted">Loading…</p></div></div>
<script src="/config.js"></script>
<script>
const URL_FN=window.SOLICITA_CONFIG.supabaseUrl+'/functions/v1/case-action';
const KEY=window.SOLICITA_CONFIG.supabaseKey;
const box=document.getElementById('box');
const t=new URLSearchParams(location.search).get('t')||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(body){
  const r=await fetch(URL_FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+KEY,'apikey':KEY},body:JSON.stringify({t,...body})});
  let j={}; try{ j=await r.json(); }catch(_){}
  if(!r.ok) throw new Error(j.error||'Something went wrong. Please try again.');
  return j;
}
function fail(m){ box.innerHTML=`<h1>Sorry</h1><p class="err">${esc(m)}</p><p class="muted">Reply to our last email and we’ll sort it out.</p>`; }
(async()=>{
  if(!t) return fail('This link is incomplete.');
  let d; try{ d=await call({mode:'preview'}); }catch(e){ return fail(e.message); }
  const field = d.needs==='amount' ? `<label for="amt">${d.client?'Amount received (€)':'Amount (€)'}</label><input id="amt" type="number" min="1" step="0.01" inputmode="decimal">`
    : d.needs==='reg' ? `<label for="reg">Official registration number (optional)</label><input id="reg" type="text" maxlength="80">` : '';
  const btnLabel = d.client ? 'Yes, it’s arrived' : 'Confirm';
  box.innerHTML=`<h1>${esc(d.title)}</h1><p>${esc(d.desc)}</p>${d.link?`<p><a href="${esc(d.link)}" target="_blank" rel="noopener">Open the official source ↗</a></p>`:''}${field}<button id="go">${btnLabel}</button><p id="msg" class="err" style="margin-top:.8rem"></p>`;
  document.getElementById('go').addEventListener('click', async e=>{
    const b=e.currentTarget, msg=document.getElementById('msg'); b.disabled=true; msg.textContent='';
    const amt=document.getElementById('amt'), reg=document.getElementById('reg');
    if(amt && !(Number(amt.value)>0)){ msg.textContent='Enter the amount.'; b.disabled=false; return; }
    try{ const r=await call({mode:'apply', amount:amt?Number(amt.value):undefined, reg:reg?reg.value:undefined}); box.innerHTML=`<h1>Done</h1><p class="ok">${esc(r.message)}</p><p class="muted">You can close this page.</p>`; }
    catch(err){ msg.textContent=err.message; b.disabled=false; }
  });
})();
</script></body></html>
